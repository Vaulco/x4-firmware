<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Reader - Files</title>
  <style>
    body { max-width: 800px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; padding: 20px; max-width: 450px; width: 90%; }
    #progress-bar { width: 100%; height: 20px; background: #ddd; margin: 10px 0; }
    #progress-fill { height: 100%; background: green; width: 0%; transition: width 0.3s; }
    .banner { background: #ffe; border: 1px solid #cc0; padding: 10px; margin-bottom: 10px; display: none; }
    .banner.show { display: block; }
    .loader { width: 40px; height: 40px; border: 4px solid #aaa; border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div>
  <span id="directory-breadcrumbs"></span>
  <button onclick="openUploadModal()">Upload</button>
  <button onclick="openFolderModal()">New Folder</button>
</div>

<!-- Failed Uploads Banner -->
<div class="banner" id="failedUploadsBanner">
  <b>⚠️ Some files failed to upload</b>
  <button onclick="dismissFailedUploads()" style="float:right">&times;</button>
  <div id="failedFilesList"></div>
  <button onclick="retryAllFailedUploads()">Retry All</button>
</div>

<div>
  <h2>Contents <small id="folder-summary"></small></h2>
  <div id="file-table">
    <div class="loader"></div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" style="display: none;" multiple>

<!-- Upload Progress Modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <button onclick="closeUploadModal()" style="float:right">&times;</button>
    <h3>📤 Uploading files</h3>
    <p>Uploading to <b id="uploadPathDisplay"></b></p>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text"></div>
  </div>
</div>

<!-- New Folder Modal -->
<div class="modal-overlay" id="folderModal">
  <div class="modal">
    <button onclick="closeFolderModal()" style="float:right">&times;</button>
    <h3>📁 New Folder</h3>
    <p>Create in <b id="folderPathDisplay"></b></p>
    <input type="text" id="folderName" placeholder="Folder name..." style="width:100%;padding:8px;margin:10px 0">
    <button onclick="createFolder()" style="width:100%;padding:10px">Create Folder</button>
  </div>
</div>

<script>
  // get current path from query parameter
  const currentPath = decodeURIComponent(new URLSearchParams(window.location.search).get('path') || '/');

  function escapeHtml(unsafe) {
    return unsafe
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)).toLocaleString() + ' ' + sizes[i];
  }

  async function hydrate() {
    // Close modals when clicking overlay
    document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
          overlay.classList.remove('open');
        }
      });
    });

    const breadcrumbs = document.getElementById('directory-breadcrumbs');
    const fileTable = document.getElementById('file-table');

    let breadcrumbContent = '';
    if (currentPath === '/') {
      breadcrumbContent += '/';
    } else {
      breadcrumbContent += '<a href="/">/</a>';
      const pathSegments = currentPath.split('/');
      pathSegments.slice(1, pathSegments.length - 1).forEach(function(segment, index) {
        breadcrumbContent += '<a href="/?path=' + encodeURIComponent(pathSegments.slice(0, index + 2).join('/')) + '">' + escapeHtml(segment) + '/</a>';
      });
      breadcrumbContent += '<b>' + escapeHtml(pathSegments[pathSegments.length - 1]) + '</b>';
    }
    breadcrumbs.innerHTML = breadcrumbContent;

    let files = [];
    try {
      const response = await fetch('/api/files?path=' + encodeURIComponent(currentPath));
      if (!response.ok) {
        throw new Error('Failed to load files: ' + response.status + ' ' + response.statusText);
      }
      files = await response.json();
    } catch (e) {
      console.error(e);
      fileTable.innerHTML = '<p><i>Error loading files</i></p>';
      return;
    }

    let folderCount = 0;
    let totalSize = 0;
    files.forEach(file => {
      if (file.isDirectory) folderCount++;
      totalSize += file.size;
    });

    document.getElementById('folder-summary').innerHTML = `(${folderCount} folders, ${files.length - folderCount} files, ${formatFileSize(totalSize)})`;

    if (files.length === 0) {
      fileTable.innerHTML = '<p><i>This folder is empty</i></p>';
    } else {
      let fileTableContent = '<table>';

      const sortedFiles = files.sort((a, b) => {
        // Directories first, then other files, alphabetically within each group
        if (a.isDirectory && !b.isDirectory) return -1;
        if (!a.isDirectory && b.isDirectory) return 1;
        return a.name.localeCompare(b.name);
      });

      sortedFiles.forEach(file => {
        if (file.isDirectory) {
          let folderPath = currentPath;
          if (!folderPath.endsWith("/")) folderPath += "/";
          folderPath += file.name;

          fileTableContent += '<tr>';
          fileTableContent += `<td><a href="/?path=${encodeURIComponent(folderPath)}">${escapeHtml(file.name)}/</a></td>`;
          fileTableContent += `<td><button onclick="deleteItem('${folderPath.replaceAll("'", "\\'")}', true)">Delete</button></td>`;
          fileTableContent += '</tr>';
        } else {
          let filePath = currentPath;
          if (!filePath.endsWith("/")) filePath += "/";
          filePath += file.name;

          fileTableContent += '<tr>';
          fileTableContent += `<td>${escapeHtml(file.name)}</td>`;
          fileTableContent += `<td><button onclick="deleteItem('${filePath.replaceAll("'", "\\'")}', false)">Delete</button></td>`;
          fileTableContent += '</tr>';
        }
      });

      fileTableContent += '</table>';
      fileTable.innerHTML = fileTableContent;
    }
  }

  // Modal functions
  function openUploadModal() {
    document.getElementById('uploadPathDisplay').textContent = currentPath;
    
    // Trigger file picker immediately
    const fileInput = document.getElementById('fileInput');
    fileInput.value = ''; // Reset file input
    fileInput.click();
  }

  // Auto-upload when files are selected
  document.getElementById('fileInput').addEventListener('change', function() {
    if (this.files.length > 0) {
      uploadFile();
    }
  });

  function closeUploadModal() {
    document.getElementById('uploadModal').classList.remove('open');
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('progress-fill').style.backgroundColor = 'green';
  }

  function openFolderModal() {
    document.getElementById('folderPathDisplay').textContent = currentPath;
    document.getElementById('folderModal').classList.add('open');
    document.getElementById('folderName').value = '';
  }

  function closeFolderModal() {
    document.getElementById('folderModal').classList.remove('open');
  }

let failedUploadsGlobal = [];

function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  const files = Array.from(fileInput.files);

  if (files.length === 0) {
    return; // Don't show alert, just silently return
  }

  // Show the upload modal
  document.getElementById('uploadModal').classList.add('open');

  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');

  let currentIndex = 0;
  const failedFiles = [];

  function uploadNextFile() {
    if (currentIndex >= files.length) {
      // All files processed - show summary
      if (failedFiles.length === 0) {
        progressFill.style.backgroundColor = 'green';
        progressText.textContent = 'All uploads complete!';
        setTimeout(() => {
          closeUploadModal();
          hydrate(); // Refresh file list instead of reloading
        }, 1000);
      } else {
        progressFill.style.backgroundColor = 'red';
        const failedList = failedFiles.map(f => f.name).join(', ');
        progressText.textContent = `${files.length - failedFiles.length}/${files.length} uploaded. Failed: ${failedList}`;
        
        // Store failed files globally and show banner
        failedUploadsGlobal = failedFiles;
        
        setTimeout(() => {
          closeUploadModal();
          showFailedUploadsBanner();
          hydrate(); // Refresh file list to show successfully uploaded files
        }, 2000);
      }
      return;
    }

    const file = files[currentIndex];
    const formData = new FormData();
    formData.append('file', file);

    const xhr = new XMLHttpRequest();
    // Include path as query parameter since multipart form data doesn't make
    // form fields available until after file upload completes
    xhr.open('POST', '/upload?path=' + encodeURIComponent(currentPath), true);

    progressFill.style.width = '0%';
    progressFill.style.backgroundColor = 'green';
    progressText.textContent = `Uploading ${file.name} (${currentIndex + 1}/${files.length})`;

    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressFill.style.width = percent + '%';
        progressText.textContent =
          `Uploading ${file.name} (${currentIndex + 1}/${files.length}) — ${percent}%`;
      }
    };

    xhr.onload = function () {
      if (xhr.status === 200) {
        currentIndex++;
        uploadNextFile(); // upload next file
      } else {
        // Track failure and continue with next file
        failedFiles.push({ name: file.name, error: xhr.responseText, file: file });
        currentIndex++;
        uploadNextFile();
      }
    };

    xhr.onerror = function () {
      // Track network error and continue with next file
      failedFiles.push({ name: file.name, error: 'network error', file: file });
      currentIndex++;
      uploadNextFile();
    };

    xhr.send(formData);
  }

  uploadNextFile();
}

function showFailedUploadsBanner() {
  const banner = document.getElementById('failedUploadsBanner');
  const filesList = document.getElementById('failedFilesList');
  
  filesList.innerHTML = '';
  
  failedUploadsGlobal.forEach((failedFile, index) => {
    const item = document.createElement('div');
    item.style.margin = '5px 0';
    item.innerHTML = `
      📄 ${escapeHtml(failedFile.name)} <small>(${escapeHtml(failedFile.error)})</small>
      <button onclick="retrySingleUpload(${index})">Retry</button>
    `;
    filesList.appendChild(item);
  });
  
  banner.classList.add('show');
}

function dismissFailedUploads() {
  const banner = document.getElementById('failedUploadsBanner');
  banner.classList.remove('show');
  failedUploadsGlobal = [];
}

function retrySingleUpload(index) {
  const failedFile = failedUploadsGlobal[index];
  if (!failedFile) return;
  
  // Create a DataTransfer to set the file input
  const dt = new DataTransfer();
  dt.items.add(failedFile.file);
  
  const fileInput = document.getElementById('fileInput');
  fileInput.files = dt.files;
  
  // Remove this file from failed list
  failedUploadsGlobal.splice(index, 1);
  
  // If no more failed files, hide banner
  if (failedUploadsGlobal.length === 0) {
    dismissFailedUploads();
  }
  
  // Trigger upload directly
  uploadFile();
}

function retryAllFailedUploads() {
  if (failedUploadsGlobal.length === 0) return;
  
  // Create a DataTransfer with all failed files
  const dt = new DataTransfer();
  failedUploadsGlobal.forEach(failedFile => {
    dt.items.add(failedFile.file);
  });
  
  const fileInput = document.getElementById('fileInput');
  fileInput.files = dt.files;
  
  // Clear failed files list
  failedUploadsGlobal = [];
  dismissFailedUploads();
  
  // Trigger upload directly
  uploadFile();
}

  function createFolder() {
    const folderName = document.getElementById('folderName').value.trim();

    if (!folderName) {
      alert('Please enter a folder name!');
      return;
    }

    // Validate folder name (no special characters except underscore and hyphen)
    const validName = /^[a-zA-Z0-9_\-]+$/.test(folderName);
    if (!validName) {
      alert('Folder name can only contain letters, numbers, underscores, and hyphens.');
      return;
    }

    const formData = new FormData();
    formData.append('name', folderName);
    formData.append('path', currentPath);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/mkdir', true);

    xhr.onload = function() {
      if (xhr.status === 200) {
        window.location.reload();
      } else {
        alert('Failed to create folder: ' + xhr.responseText);
      }
    };

    xhr.onerror = function() {
      alert('Failed to create folder - network error');
    };

    xhr.send(formData);
  }

  // Delete function - now directly deletes without confirmation
  function deleteItem(path, isFolder) {
    const formData = new FormData();
    formData.append('path', path);
    formData.append('type', isFolder ? 'folder' : 'file');

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/delete', true);

    xhr.onload = function() {
      if (xhr.status === 200) {
        window.location.reload();
      } else {
        alert('Failed to delete: ' + xhr.responseText);
      }
    };

    xhr.onerror = function() {
      alert('Failed to delete - network error');
    };

    xhr.send(formData);
  }

  hydrate();
</script>
</body>
</html>
