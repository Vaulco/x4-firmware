<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Reader - Files</title>
  <style>
    body { max-width: 600px; margin: 0 auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    td, th { text-align: left;}
    td:first-child { width: 85%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td:last-child { width: 15%; text-align: right; }
    button, input { font-family: serif; }
    .controls { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .controls input { width: 200px;}
    .upload-progress { display: none; font-size: 14px; }
    .upload-progress.show { display: inline; }
    #retryAllButton { display: none; }
    #retryAllButton.show { display: inline-block; }
    input[type="file"] {
      display: inline-block;
      font-family: serif;
    }
  </style>
</head>
<body>

<div class="controls">
  <input type="file" id="fileInput" multiple>
  <button id="retryAllButton" onclick="retryAllFailedUploads()">Retry All</button>
  <span class="upload-progress" id="uploadProgress"></span>
</div>

<div class="controls">
  <input type="text" id="folderName" placeholder="Folder name...">
  <button onclick="createFolder()">Create Folder</button>
</div>

<div>
  <p id="headerInfo"></p>
  <div id="file-table"></div>
</div>

<script>
  const currentPath = decodeURIComponent(new URLSearchParams(window.location.search).get('path') || '/');
  let failedUploads = [];

  function escapeHtml(unsafe) {
    return unsafe
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)).toLocaleString() + ' ' + sizes[i];
  }

  function buildPath(fileName) {
    return currentPath.endsWith("/") ? currentPath + fileName : currentPath + "/" + fileName;
  }

  function toggleRetryButton(show) {
    document.getElementById('retryAllButton').classList.toggle('show', show);
  }

  function updateProgress(message, show = true) {
    const progressText = document.getElementById('uploadProgress');
    progressText.textContent = message;
    progressText.classList.toggle('show', show);
  }

  function handleXhrError(action) {
    alert(`Failed to ${action} - network error`);
  }

  async function hydrate() {
    const headerInfo = document.getElementById('headerInfo');
    const fileTable = document.getElementById('file-table');

    // Build breadcrumbs
    let breadcrumbs = '';
    if (currentPath === '/') {
      breadcrumbs = '/';
    } else {
      breadcrumbs = '<a href="/">/</a>';
      const pathSegments = currentPath.split('/');
      pathSegments.slice(1, pathSegments.length - 1).forEach((segment, index) => {
        breadcrumbs += '<a href="/?path=' + encodeURIComponent(pathSegments.slice(0, index + 2).join('/')) + '">' + escapeHtml(segment) + '/</a>';
      });
      breadcrumbs += '<span>' + escapeHtml(pathSegments[pathSegments.length - 1]) + '</span>';
    }

    // Fetch files
    let files = [];
    try {
      const response = await fetch('/api/files?path=' + encodeURIComponent(currentPath));
      if (!response.ok) {
        throw new Error('Failed to load files: ' + response.status + ' ' + response.statusText);
      }
      files = await response.json();
    } catch (e) {
      console.error(e);
      fileTable.innerHTML = '<p><i>Error loading files</i></p>';
      return;
    }

    // Calculate summary
    const folderCount = files.filter(f => f.isDirectory).length;
    const totalSize = files.reduce((sum, f) => sum + f.size, 0);
    const summary = `${folderCount} folders, ${files.length - folderCount} files, ${formatFileSize(totalSize)}`;

    // Combined header
    headerInfo.innerHTML = `<strong>${breadcrumbs}</strong> — ${summary}`;

    if (files.length === 0) {
      fileTable.innerHTML = '<p><i>This folder is empty</i></p>';
      return;
    }

    // Sort and render files
    const sortedFiles = files.sort((a, b) => {
      if (a.isDirectory && !b.isDirectory) return -1;
      if (!a.isDirectory && b.isDirectory) return 1;
      return a.name.localeCompare(b.name);
    });

    let tableHTML = '<table>';
    sortedFiles.forEach(file => {
      const fullPath = buildPath(file.name);
      const escapedPath = fullPath.replaceAll("'", "\\'");
      const displayName = escapeHtml(file.name) + (file.isDirectory ? '/' : '');
      
      tableHTML += '<tr>';
      if (file.isDirectory) {
        tableHTML += `<td><a href="/?path=${encodeURIComponent(fullPath)}" title="${displayName}">${displayName}</a></td>`;
      } else {
        tableHTML += `<td title="${displayName}">${displayName}</td>`;
      }
      tableHTML += `<td><button onclick="deleteItem('${escapedPath}', ${file.isDirectory})">Delete</button></td>`;
      tableHTML += '</tr>';
    });
    tableHTML += '</table>';
    
    fileTable.innerHTML = tableHTML;
  }

  // Auto-upload when files are selected
  document.getElementById('fileInput').addEventListener('change', function() {
    if (this.files.length > 0) {
      uploadFiles();
    }
  });

  function uploadFiles() {
    const fileInput = document.getElementById('fileInput');
    const files = Array.from(fileInput.files);

    if (files.length === 0) return;

    let currentIndex = 0;
    const failedFiles = [];

    function uploadNext() {
      if (currentIndex >= files.length) {
        // All files processed
        if (failedFiles.length === 0) {
          updateProgress('✓ Complete');
          setTimeout(() => {
            updateProgress('', false);
            hydrate();
          }, 1000);
        } else {
          updateProgress(`⚠ ${files.length - failedFiles.length}/${files.length} uploaded`);
          failedUploads = failedFiles;
          setTimeout(() => {
            updateProgress('', false);
            toggleRetryButton(true);
            hydrate();
          }, 2000);
        }
        return;
      }

      const file = files[currentIndex];
      const formData = new FormData();
      formData.append('file', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload?path=' + encodeURIComponent(currentPath), true);

      updateProgress(`Uploading ${file.name} (${currentIndex + 1}/${files.length}) — 0%`);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          updateProgress(`Uploading ${file.name} (${currentIndex + 1}/${files.length}) — ${percent}%`);
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          currentIndex++;
          uploadNext();
        } else {
          failedFiles.push({ name: file.name, error: xhr.responseText, file: file });
          currentIndex++;
          uploadNext();
        }
      };

      xhr.onerror = () => {
        failedFiles.push({ name: file.name, error: 'network error', file: file });
        currentIndex++;
        uploadNext();
      };

      xhr.send(formData);
    }

    uploadNext();
  }

  function retryAllFailedUploads() {
    if (failedUploads.length === 0) return;
    
    const dt = new DataTransfer();
    failedUploads.forEach(failed => dt.items.add(failed.file));
    
    document.getElementById('fileInput').files = dt.files;
    failedUploads = [];
    toggleRetryButton(false);
    
    uploadFiles();
  }

  function createFolder() {
    const folderName = document.getElementById('folderName').value.trim();

    if (!folderName) {
      alert('Please enter a folder name!');
      return;
    }

    if (!/^[a-zA-Z0-9_\- ]+$/.test(folderName)) {
      alert('Folder name can only contain letters, numbers, underscores, hyphens, and spaces.');
      return;
    }

    const formData = new FormData();
    formData.append('name', folderName);
    formData.append('path', currentPath);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/mkdir', true);

    xhr.onload = () => {
      if (xhr.status === 200) {
        window.location.reload();
      } else {
        alert('Failed to create folder: ' + xhr.responseText);
      }
    };

    xhr.onerror = () => handleXhrError('create folder');
    xhr.send(formData);
  }

  function deleteItem(path, isFolder) {
    const formData = new FormData();
    formData.append('path', path);
    formData.append('type', isFolder ? 'folder' : 'file');

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/delete', true);

    xhr.onload = () => {
      if (xhr.status === 200) {
        window.location.reload();
      } else {
        alert('Failed to delete: ' + xhr.responseText);
      }
    };

    xhr.onerror = () => handleXhrError('delete');
    xhr.send(formData);
  }

  hydrate();
</script>
</body>
</html>
